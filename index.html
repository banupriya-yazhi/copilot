<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Sign in</h1>
    <p class="subtitle">Welcome back. Please enter your details.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email"
               placeholder="you@example.com" required>
        <span class="error" id="email-error" role="alert"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password"
                 autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="toggle" id="toggle-password"
                  aria-label="Show password">Show</button>
        </div>
        <span class="error" id="password-error" role="alert"></span>
      </div>

      <div class="row">
        <label class="checkbox">
          <input type="checkbox" id="remember" name="remember">
          <span>Remember me</span>
        </label>
        <a class="link" href="#">Forgot password?</a>
      </div>

      <button type="submit" class="submit">Sign in</button>
      <p class="status" id="status" role="status"></p>
    </form>

    <p class="footer">Don't have an account? <a class="link" href="#">Sign up</a></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
